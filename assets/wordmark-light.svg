<svg xmlns="http://www.w3.org/2000/svg" width="301" height="82" viewBox="0 8 301 82" role="img" aria-label="Okay-Garmin">
  <title>Okay-Garmin</title>
  <desc>Okay-Garmin wordmark: a waveform mark beside the name.</desc>
  <defs>
    <linearGradient id="ogBrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="ogMark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect x="8" y="16" width="64" height="64" rx="18" fill="url(#ogMark)"/>
  <g fill="#ffffff" opacity="0.96">
    <rect x="21" y="41" width="5" height="14" rx="2.5"/>
    <rect x="30" y="33" width="5" height="30" rx="2.5"/>
    <rect x="39" y="26" width="5" height="44" rx="2.5"/>
    <rect x="48" y="35" width="5" height="26" rx="2.5"/>
    <rect x="57" y="43" width="5" height="10" rx="2.5"/>
  </g>

  <!-- textLength pins the advance width so the lockup measures the same on a
       machine without Segoe UI. The viewBox is sized to exactly this content
       plus 8px all round, which is what keeps it centred wherever it is placed. -->
  <text x="90" y="59" textLength="203.1" lengthAdjust="spacing"
        font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif"
        font-size="34" letter-spacing="-0.6">
    <tspan fill="#475569" font-weight="500">Okay-</tspan><tspan fill="url(#ogBrand)" font-weight="700">Garmin</tspan>
  </text>
  <text x="91" y="79" textLength="129.3" lengthAdjust="spacing"
        font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif"
        font-size="12.5" font-weight="500" letter-spacing="2.6" fill="#94a3b8">VOICE CONTROL</text>
</svg>
