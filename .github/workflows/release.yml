name: Release

# Tag a version to publish it:
#   git tag v2.0.0 && git push origin v2.0.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without the leading v)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Check the tag matches version.py
        shell: pwsh
        run: |
          $v = (Select-String -Path src\okay_garmin\version.py `
                 -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') {
            $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
            '${{ github.event.inputs.version }}'
          }
          Write-Host "version.py: $v   tag: $tag"
          if ($v -ne $tag) {
            throw "version.py says $v but the tag says $tag -- bump one of them."
          }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify translations
        run: uv run python scripts/check_i18n.py

      - name: Build
        shell: pwsh
        run: .\build.ps1

      - name: Show what was built
        shell: pwsh
        run: Get-ChildItem dist -Recurse -File | Select-Object FullName, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Okay-Garmin-${{ env.VERSION }}
          path: |
            dist/installer/Okay-Garmin-Setup-*.exe
            dist/installer/latest.json

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$env:VERSION" `
            "dist/installer/Okay-Garmin-Setup-$env:VERSION.exe" `
            "dist/installer/latest.json" `
            --title "v$env:VERSION" `
            --generate-notes
