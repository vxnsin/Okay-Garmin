[project]
name = "okay-garmin"
dynamic = ["version"]
description = "Fully offline voice control for Windows. Say the wake word, run a command."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Vensin", email = "vxnsin@icloud.com" },
]
dependencies = [
    "faster-whisper>=1.1.0",
    "numpy>=2.0",
    "packaging>=24.0",
    "pillow>=11.0",
    "pynput>=1.8.1",
    "pystray>=0.19.5",
    "pywebview>=5.3",
    "pywin32>=306",
    "requests>=2.32.0",
    "sounddevice>=0.5.0",
    "vosk>=0.3.45",
    "winotify>=1.1.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.10.0",
]

[project.scripts]
okay-garmin = "okay_garmin.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/okay_garmin/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/okay_garmin"]
